[project]
name = "alpamayo-recipes"
version = "0.1.0"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

# Recipe-side utilities shared by the per-version recipes under recipes/:
# chat templates, data loaders, metrics, common helpers, visualization, etc.
# Runtime dependencies are specified by the consuming recipe.
[tool.hatch.build.targets.wheel]
packages = ["alpamayo"]
