[project]
name = "alpamayo2edge-sft"
version = "0.1.0"
description = "Joint supervised fine-tuning for the Alpamayo 2 Edge model"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.12.*"
dependencies = [
  "alpamayo2-edge @ git+https://github.com/NVlabs/alpamayo2-edge.git@c4980c0028621ab1e442c6af98ad20aeb5ed3d6b",
  "accelerate>=1.12.0",
  "av>=16.0.1",
  "einops>=0.8.1",
  "hydra-colorlog>=1.2.0",
  "hydra-core>=1.3.2",
  "mediapy>=1.2.4",
  "opencv-python>=4.10.0",
  "pandas>=2.3.3",
  "scipy>=1.16.0",
  "physical_ai_av>=0.2.0",
  "pillow>=12.0.0",
  "torch==2.8.0",
  "torchvision>=0.23.0",
  "transformers==5.17.0",
  "rich>=14.3.3",
  "wandb>=0.25.0",
  "torchmetrics==1.8.2",
  "deepspeed==0.19.1",
]

[project.optional-dependencies]
flash = ["flash-attn==2.8.3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Explicit mapping keeps both editable installs and extracted source distributions
# importable without relying on the parent directory's name.
[tool.setuptools]
packages = ["alpamayo2edge_sft", "alpamayo2edge_sft.configs", "alpamayo2edge_sft.models"]

[tool.setuptools.package-dir]
alpamayo2edge_sft = "."

[tool.setuptools.package-data]
alpamayo2edge_sft = [
  "configs/**/*.yaml",
  "configs/**/*.json",
  "README.md",
  "assets/*.svg",
  "assets/*.png",
  "assets/*.json",
]

# Keep README-only training screenshots outside the installed package.
[tool.setuptools.exclude-package-data]
alpamayo2edge_sft = [
  "assets/training_loss_wandb.png",
  "assets/PAI_sample_train_plot.png",
]

[dependency-groups]
# Checkout-local helpers are installed by uv, never resolved by name from PyPI.
shared = ["alpamayo-recipes"]
dev = [
  "matplotlib>=3.10.7",
  "mediapy>=1.2.4",
  "ipykernel>=6.29.3",
  "ipywidgets>=8.1.8",
  "pytest>=8.0.0",
  "tqdm",
]

[tool.uv]
default-groups = ["dev", "shared"]
no-build-isolation-package = ["flash-attn"]
override-dependencies = ["deepspeed==0.19.1"]

[tool.uv.sources]
alpamayo-recipes = { path = "../../src", editable = true }
alpamayo2-edge = { git = "https://github.com/NVlabs/alpamayo2-edge.git" }

[tool.ruff]
line-length = 100
