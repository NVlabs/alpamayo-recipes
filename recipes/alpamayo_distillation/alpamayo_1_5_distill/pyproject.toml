[project]
name = "alpamayo1-5-distill"
version = "0.1.0"
description = "Online teacher-student distillation for Alpamayo 1.5"
requires-python = "==3.12.*"
dependencies = [
  "alpamayo1_5 @ git+https://github.com/NVlabs/alpamayo1.5.git@36aeb4c5938cbc2eb2aed33b22434773da4ab639",
  "accelerate>=1.12.0",
  "av>=16.0.1",
  "einops>=0.8.1",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "pandas>=2.3.3",
  "physical-ai-av==0.2.0",
  "pillow>=12.0.0",
  "safetensors>=0.6.2",
  "scipy>=1.16.0",
  "torch==2.8.0",
  "torchvision>=0.23.0",
  "transformers==4.57.1",
  "flash-attn>=2.8.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages = [
  "alpamayo1_5_distill",
  "alpamayo1_5_distill.configs",
  "alpamayo1_5_distill.data",
  "alpamayo1_5_distill.diffusion",
  "alpamayo1_5_distill.models",
  "alpamayo1_5_distill.training",
]
package-dir = { alpamayo1_5_distill = "." }

[tool.setuptools.package-data]
alpamayo1_5_distill = ["configs/*.yaml", "assets/*.txt"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pre-commit>=4.5.1"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[tool.ruff]
line-length = 100
