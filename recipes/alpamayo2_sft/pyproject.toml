[project]
name = "alpamayo2-sft"
version = "0.1.0"
description = "Supervised fine-tuning for the released Alpamayo 2 Super model"
requires-python = "==3.12.*"
dependencies = [
  "alpamayo2_super",
  "alpamayo-recipes",
  "accelerate>=1.12.0",
  "av>=16.0.1",
  "einops>=0.8.1",
  "hydra-colorlog>=1.2.0",
  "hydra-core>=1.3.2",
  "mediapy>=1.2.4",
  "opencv-python>=4.10.0",
  "pandas>=2.3.3",
  "physical_ai_av>=0.2.0",
  "pillow>=12.0.0",
  "torch==2.8.0",
  "torchvision>=0.23.0",
  "transformers==4.57.1",
  "flash-attn>=2.8.3",
  "rich>=14.3.3",
  "wandb>=0.25.0",
  "torchmetrics==1.8.2",
  "deepspeed==0.19.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Look one level up (recipes/) so setuptools finds alpamayo2_sft/ as a proper package.
# The editable install adds recipes/ to sys.path, making `alpamayo2_sft` importable
# from within this directory once the venv is active.
[tool.setuptools.packages.find]
where = [".."]
include = ["alpamayo2_sft*"]

[dependency-groups]
dev = [
  "matplotlib>=3.10.7",
  "mediapy>=1.2.4",
  "ipykernel>=6.29.3",
  "ipywidgets>=8.1.8",
  "pytest>=8.0.0",
  "tqdm",
]

[tool.uv]
no-build-isolation-package = ["flash-attn"]
override-dependencies = ["deepspeed==0.19.1"]

[tool.uv.sources]
alpamayo-recipes = { path = "../../src", editable = true }
alpamayo2_super = { git = "https://github.com/NVlabs/alpamayo2.git" }

[tool.ruff]
line-length = 100
